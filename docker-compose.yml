services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: autoapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoapp}
      POSTGRES_DB: autoapp
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoapp -d autoapp"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://autoapp:${POSTGRES_PASSWORD:-autoapp}@db:5432/autoapp
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx node-pg-migrate up -m ./db/migrations && node dist/main"

volumes:
  db_data:
