services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: autoapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoapp}
      POSTGRES_DB: autoapp
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoapp -d autoapp"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgres://autoapp:${POSTGRES_PASSWORD:-autoapp}@db:5432/autoapp
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://autoapp:${POSTGRES_PASSWORD:-autoapp}@db:5432/autoapp
      PORT: "3000"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  db_data:
