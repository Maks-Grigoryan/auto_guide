name: avto_app
description: Авто-агрегатор — СТО и запчасти для Армении и СНГ
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Navigation
  go_router: 17.3.0

  # HTTP client
  dio: 5.9.2

  # Local persistence
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # Location
  geolocator: ^14.0.3

  # Native actions (phone dialer and navigation deep links)
  url_launcher: ^6.3.2

  # Map — native SDK on mobile; the web build uses the Yandex Maps JS API 3.0
  # through web/yandex_map.js instead (this package has no web support).
  yandex_maps_mapkit: ^4.36.0

  # DOM interop for the web map platform view (web build only).
  web: ^1.1.0

  # Access-token storage — Keychain on iOS, EncryptedSharedPreferences on
  # Android, WebCrypto-wrapped storage on web. The token deliberately does not
  # go in the existing Hive boxes: those are plain files on disk.
  flutter_secure_storage: ^11.0.0

  # UI
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Code generation
  riverpod_generator: ^3.0.3
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    # Sign-in backdrop. Rendered from the same car model and studio lighting the
    # intro uses, so the screen the intro hands over to is visibly the same set
    # — and so no third-party stock photo has to be licensed to get there.
    - assets/images/
  generate: true
