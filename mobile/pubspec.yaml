name: avto_app
description: Авто-агрегатор — СТО и запчасти для Армении и СНГ
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: 3.0.3
  riverpod_annotation: 3.0.3

  # Navigation
  go_router: 17.3.0

  # HTTP client
  dio: 5.9.2

  # Local persistence
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # UI
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Code generation
  riverpod_generator: 3.0.3
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
